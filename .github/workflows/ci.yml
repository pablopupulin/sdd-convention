name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Hook tests
        run: python -m pytest tests/ -v
      - name: Scaffold hygiene linter self-check
        run: python scaffold/scripts/check-docs.py scaffold/docs
      - name: Validate plugin.json
        run: python -m json.tool .claude-plugin/plugin.json
      - name: Validate marketplace.json
        run: python -m json.tool .claude-plugin/marketplace.json
      - name: Validate hooks.json
        run: python -m json.tool hooks/hooks.json
